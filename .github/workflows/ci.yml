name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Run verifier smoke test
        run: python verify.py --start 3 --stop 8 --skip-frontier

      - name: Verify complete global brackets and original input binding
        run: python -I -S verify_global_brackets.py

      - name: Verify Proposition 7 standalone supplement and integrity controls
        run: |
          python -I -S paper_assets/asymptotic_sequel/proposition7_supplement/verify.py
          python -I -S paper_assets/asymptotic_sequel/proposition7_supplement/check_integrity_controls.py
